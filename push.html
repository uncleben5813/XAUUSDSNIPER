<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Enable XAU Push</title>
<style>body{font-family:Arial,sans-serif;background:#eef2f6;margin:0;padding:24px;color:#172033}.box{max-width:520px;margin:40px auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 30px #0001;text-align:center}button{border:0;border-radius:10px;padding:13px 18px;background:#2563eb;color:#fff;font-weight:800}#status{margin:16px 0;font-size:14px;white-space:pre-wrap}</style>
</head>
<body><div class="box"><h2>🔔 XAU/USD Push Notification</h2><p>Enable notification sekali. Lepas subscription berjaya, alert boleh masuk walaupun dashboard ditutup dan phone dikunci, selagi OS/browser membenarkan web push.</p><button id="btn">ENABLE PUSH</button><div id="status">Checking...</div></div>
<script>
const $=id=>document.getElementById(id);
function b64ToUint8Array(base64){const padding='='.repeat((4-base64.length%4)%4);const raw=atob((base64+padding).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function enable(){
 try{
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)) throw new Error('Browser ini tidak menyokong Web Push. Pada iPhone, buka melalui Home Screen PWA.');
  $('status').textContent='Registering service worker...';
  const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
  await navigator.serviceWorker.ready;
  const cfg=await fetch('/api/push-config?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json());
  if(!cfg.publicKey) throw new Error(cfg.error||'VAPID_PUBLIC_KEY missing');
  const permission=await Notification.requestPermission();
  if(permission!=='granted') throw new Error('Notification permission: '+permission);
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToUint8Array(cfg.publicKey)});
  const saved=await fetch('/api/push-subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)}).then(r=>r.json());
  if(!saved.ok) throw new Error(saved.error||'Subscription failed');
  const status=await fetch('/api/push-status').then(r=>r.json());
  $('status').textContent='✅ PUSH ACTIVE\nSubscriptions: '+(status.redis?.subscriptionCount??saved.count)+'\nReady: '+status.ready+'\n\nRedirecting...';
  setTimeout(()=>location.href='/',1000);
 }catch(e){$('status').textContent='❌ '+e.message;}
}
$('btn').addEventListener('click',enable);
</script></body></html>
